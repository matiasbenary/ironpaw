[package]
name = "ironpaw"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
bip39 = "2"
chacha20poly1305 = "0.10"
chrono = "0.4.45"
cron = "0.16.0"
chromiumoxide = "0.9.1"
dotenvy = "0.15"
futures = "0.3"
hkdf = "0.12"
imap = "3.0.0-alpha.15"
lettre = "0.11"
pdf-extract = "0.7"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
rquickjs = "0.12.0"
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "43", features = ["component-model"] }
wasmtime-wasi = "43"
zip = { version = "2", default-features = false, features = ["deflate"] }

[[test]]
name = "live_tests"
path = "tests_live/mod.rs"
