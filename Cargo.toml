[package]
name = "warden"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
async-openai = { version = "0.38", default-features = false, features = ["chat-completion-types", "response-types"] }
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
pdf-extract = "0.7"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "43", features = ["component-model"] }
wasmtime-wasi = "43"

[[test]]
name = "live_tests"
path = "tests/live_tests/mod.rs"
