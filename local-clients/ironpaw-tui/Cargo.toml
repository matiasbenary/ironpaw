[package]
name = "ironpaw-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
